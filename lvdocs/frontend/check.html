<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Проверка документов — LVDOCS.AI</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="js/theme.js"></script>
</head>
<body>
    <header>
        <nav class="nav">
            <a href="index.html" class="logo">
                <svg class="logo-mark" viewBox="0 0 40 40" xmlns="http://www.w3.org/2000/svg">
                    <path d="M6 3 H26 L34 11 V37 H6 Z" fill="#9E3039"/>
                    <path d="M26 3 V11 H34 Z" fill="#7a252c"/>
                    <rect x="6" y="20" width="28" height="5" fill="#ffffff"/>
                    <path d="M20 13 L21.5 17 L25.5 18.5 L21.5 20 L20 24 L18.5 20 L14.5 18.5 L18.5 17 Z" fill="#ffffff"/>
                </svg>
                <span class="logo-text">LVDOCS<span class="ai">.AI</span></span>
            </a>
            <ul class="nav-links">
                <li><a href="index.html" data-i18n="nav.home">Главная</a></li>
                <li><a href="check.html" class="active" data-i18n="nav.check">Проверка</a></li>
                <li><a href="ocr.html" data-i18n="nav.ocr">Распознавание</a></li>
                <li><a href="docs.html" data-i18n="nav.docs">Документы</a></li>
                <li><a href="analyze.html" data-i18n="nav.analyze">ИИ-проверка</a></li>
                <li><a href="profile.html" data-i18n="nav.profile">Профиль</a></li>
                <li><a href="about.html" data-i18n="nav.about">О нас</a></li>
            </ul>
            <div class="lang-switch" role="group" aria-label="Language">
                <button type="button" class="lang-btn" data-lang="lv"><svg class="flag" viewBox="0 0 24 16" aria-hidden="true"><rect width="24" height="16" fill="#9E3039"/><rect y="6.4" width="24" height="3.2" fill="#fff"/></svg>LV</button>
                <button type="button" class="lang-btn" data-lang="ru"><svg class="flag" viewBox="0 0 24 16" aria-hidden="true"><rect width="24" height="5.34" fill="#fff"/><rect y="5.33" width="24" height="5.34" fill="#0039A6"/><rect y="10.66" width="24" height="5.34" fill="#D52B1E"/></svg>RU</button>
                <button type="button" class="lang-btn" data-lang="en"><svg class="flag" viewBox="0 0 24 16" aria-hidden="true"><rect width="24" height="16" fill="#012169"/><path d="M0 0L24 16M24 0L0 16" stroke="#fff" stroke-width="3.2"/><path d="M0 0L24 16M24 0L0 16" stroke="#C8102E" stroke-width="1.2"/><path d="M12 0V16M0 8H24" stroke="#fff" stroke-width="5.2"/><path d="M12 0V16M0 8H24" stroke="#C8102E" stroke-width="3"/></svg>EN</button>
            </div>
        </nav>
    </header>

    <main>
        <h1 data-i18n="check.title">Проверка документов</h1>
        <p class="lead" data-i18n="check.lead">Загрузите фото, выберите тип документа и сохраните его в профиль.</p>

        <div class="check-layout">

            <!-- ЛЕВАЯ КОЛОНКА: фото -->
            <div class="check-card">
                <h3 style="margin-bottom:16px;" data-i18n="check.photo">📷 Фото документа</h3>

                <label class="upload-zone" for="fileInput" id="uploadZone">
                    <div class="icon">🖼️</div>
                    <p data-i18n="check.photo_hint">Нажмите или перетащите фото сюда</p>
                    <span class="btn" data-i18n="check.choose_file">Выбрать файл</span>
                </label>
                <input type="file" id="fileInput" accept="image/jpeg,image/png,image/webp" style="display:none;">

                <div id="previewWrap" style="display:none; margin-top:16px;">
                    <img id="preview" class="preview" alt="Preview">
                    <button type="button" class="btn-secondary btn" style="margin-top:12px; width:100%;"
                            onclick="clearImage()" data-i18n="check.delete_photo">Удалить фото</button>
                </div>
            </div>

            <!-- ПРАВАЯ КОЛОНКА: список + сохранить -->
            <div class="check-card">
                <h3 style="margin-bottom:16px;" data-i18n="check.data">🔎 Данные документа</h3>

                <label for="docType" style="display:block; margin-bottom:8px; font-weight:600; font-size:14px;"
                       data-i18n="check.type">Тип документа</label>
                <select id="docType"
                        style="width:100%; padding:12px; border:1.5px solid var(--border); border-radius:8px; font-size:15px; margin-bottom:16px; background:var(--white); color:var(--text-dark); font-family:inherit;">
                    <option value="" data-i18n="check.type_choose">— Выберите тип —</option>
                    <option value="passport" data-i18n="doctype.passport">Паспорт</option>
                    <option value="id_card" data-i18n="doctype.id_card">ID-карта</option>
                    <option value="visa_c" data-i18n="doctype.visa_c">Шенгенская виза (C)</option>
                    <option value="visa_d" data-i18n="doctype.visa_d">Национальная виза (D)</option>
                    <option value="residence" data-i18n="doctype.residence">Вид на жительство (ВНЖ)</option>
                    <option value="driver" data-i18n="doctype.driver">Водительское удостоверение</option>
                    <option value="insurance" data-i18n="doctype.insurance">Медицинская страховка</option>
                    <option value="birth_cert" data-i18n="doctype.birth_cert">Свидетельство о рождении</option>
                    <option value="marriage_cert" data-i18n="doctype.marriage_cert">Свидетельство о браке</option>
                    <option value="criminal" data-i18n="doctype.criminal">Справка о несудимости</option>
                    <option value="diploma" data-i18n="doctype.diploma">Диплом</option>
                    <option value="transcript" data-i18n="doctype.transcript">Приложение к диплому / транскрипт</option>
                    <option value="school_certificate" data-i18n="doctype.school_certificate">Школьный аттестат</option>
                    <option value="bank_statement" data-i18n="doctype.bank_statement">Банковская выписка</option>
                    <option value="pmlp_invitation" data-i18n="doctype.pmlp_invitation">Приглашение PMLP (Izsaukums)</option>
                    <option value="study_agreement" data-i18n="doctype.study_agreement">Договор с университетом</option>
                    <option value="other" data-i18n="doctype.other">Другое</option>
                </select>

                <button type="button" class="btn" onclick="saveDocument()" style="width:100%;"
                        data-i18n="check.save">Сохранить в профиль</button>

                <div id="checkMsg" style="margin-top:16px;"></div>
            </div>
        </div>
    </main>

    <footer>
        © 2026 LVDOCS.AI <span class="flag-stripe"></span> <span data-i18n="footer.note">Сделано в Латвии</span>
    </footer>

    <script src="js/i18n.js"></script>
    <script src="js/profile.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
